<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>NetCore</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/6963/6963813.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Libre+Caslon+Condensed:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050a05;
            background-image: linear-gradient(rgba(0, 20, 0, 0.65), rgba(0, 20, 0, 0.65)),
                              url('https://raw.githubusercontent.com/LarryFoxy/foxapp.github.io/refs/heads/main/background.webp');
            background-size: cover;
            background-position: center;
            color: #bbccaa;
            font-family: Arial, sans-serif;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background:
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        .container {
            text-align: center;
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 600px;
        }
        .logo {
            font-family: 'Cormorant Garamond', 'Times New Roman', serif;
            font-weight: 900;
            font-size: 86px;
            margin-bottom: 10px;
            letter-spacing: -2px;
            user-select: none;
        }
        .logo span:nth-child(1) {
            display: inline-block;
            color: transparent !important;
            background-image: linear-gradient(
                180deg,
                #7390f0 0%,
                #587bed 30%,
                #1e3375 60%,
                #162454 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            filter:
                drop-shadow(0 1px 0 rgba(0, 0, 0, 0.95))
                drop-shadow(0 -1px 0 rgba(255, 255, 255, 0.28));
        }
        .logo span:nth-child(2) {
            display: inline-block;
            color: transparent !important;
            background-image: linear-gradient(
                180deg,
                #8f2125 0%,
                #8f2125 50%,
                #70181b 65%,
                #400e10 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            filter:
                drop-shadow(0 1px 0 rgba(0, 0, 0, 0.95))
                drop-shadow(0 -1px 0 rgba(255, 255, 255, 0.28));
        }
        .logo span:nth-child(3) {
            display: inline-block;
            color: transparent !important;
            background-image: linear-gradient(
                180deg,
                #c6c916 0%,
                #c6c916 20%,
                #b0b314 40%,
                #262604 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            filter:
                drop-shadow(0 1px 0 rgba(0, 0, 0, 0.95))
                drop-shadow(0 -1px 0 rgba(255, 255, 255, 0.28));
        }
        .logo span:nth-child(4) {
            display: inline-block;
            color: transparent !important;
            background-image: linear-gradient(
                180deg,
                #7390f0 0%,
                #7390f0 40%,
                #1e3375 60%,
                #162454 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            filter:
                drop-shadow(0 1px 0 rgba(0, 0, 0, 0.95))
                drop-shadow(0 -1px 0 rgba(255, 255, 255, 0.28));
        }
        .logo span:nth-child(5) {
            display: inline-block;
            color: transparent !important;
            background-image: linear-gradient(
                180deg,
                #14c929 0%,
                #14c929 40%,
                #0f911e 60%,
                #074a0f 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            filter:
                drop-shadow(0 1px 0 rgba(0, 0, 0, 0.95))
                drop-shadow(0 -1px 0 rgba(255, 255, 255, 0.28));
        }
        .logo span:nth-child(6) {
            display: inline-block;
            color: transparent !important;
            background-image: linear-gradient(
                180deg,
                #8f2125 0%,
                #8f2125 50%,
                #70181b 65%,
                #400e10 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            filter:
                drop-shadow(0 1px 0 rgba(0, 0, 0, 0.95))
                drop-shadow(0 -1px 0 rgba(255, 255, 255, 0.28));
        }
        .logo span:nth-child(7) {
            display: inline-block;
            color: transparent !important;
            background-image: linear-gradient(
                180deg,
                #c6c916 0%,
                #c6c916 20%,
                #b0b314 40%,
                #262604 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            filter:
                drop-shadow(0 1px 0 rgba(0, 0, 0, 0.95))
                drop-shadow(0 -1px 0 rgba(255, 255, 255, 0.28));
        }
        .links-top {
            margin-bottom: 5px;
        }
        .links-top a {
            color: #ddeeaa;
            text-decoration: underline;
            margin: 0 4px;
            font-size: 12px;
        }
        .links-top a.active {
            font-weight: bold;
            color: #fff;
            text-decoration: none;
        }
        form {
            margin-bottom: 15px;
        }
        .search-wrapper {
            display: inline-block;
            position: relative;
        }
        input[type="text"] {
            width: 380px;
            padding: 3px;
            border: 1px solid #556644;
            background-color: #0b140b;
            color: #ddeedd;
            font-size: 14px;
            outline: none;
        }
        .side-links {
            position: absolute;
            left: 395px;
            top: -5px;
            text-align: left;
            white-space: nowrap;
            font-size: 11px;
        }
        .side-links a {
            color: #aabf99;
            text-decoration: underline;
            display: block;
            line-height: 1.2;
        }
        .buttons {
            margin-top: 10px;
        }
        input[type="submit"],
        button {
            background-color: #152215;
            color: #bbccaa;
            border: 1px solid #445533;
            padding: 2px 8px;
            margin: 0 3px;
            cursor: pointer;
            font-size: 13px;
        }
        input[type="submit"]:hover,
        button:hover {
            background-color: #203320;
            color: #ddeedd;
        }
        .welcome-text {
            color: #889977;
            font-size: 13px;
            margin-top: 15px;
            text-decoration: underline;
            cursor: pointer;
        }
        .footer {
            margin-top: 40px;
            font-size: 11px;
        }
        .footer a {
            color: #aabf99;
            text-decoration: underline;
            margin: 0 5px;
        }
        .copyright {
            color: #667755;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <span>N</span><span>e</span><span>t</span><span>c</span><span>o</span><span>r</span><span>e</span>
    </div>
    <div class="links-top">
        <a class="active" href="#">Web</a>
        <a href="https://jutu.pl/ru">Images</a>
        <a href="https://www.youtube.com" target="_blank">Youtube</a>
        <a href="https://www.youtube.com/@alexandrshtefanov">News</a>
        <a href="https://m-fur.ru/furmap/">Map</a>
        <a href="https://pawchive.pw/artists">Pawchive</a>
        <a href="#">more »</a>
    </div>
    <form id="searchForm" action="javascript:void(0);">
        <div class="search-wrapper">
            <input type="text" id="queryInput" autofocus autocomplete="off" required>
            <div class="side-links">
                <a href="https://www.wikipedia.org/">Advanced Search</a>
                <a href="#">Preferences</a>
                <a href="https://translate.google.com/?sl=en&tl=ru&op=translate">Language Tools</a>
            </div>
        </div>
        <div class="buttons">
            <input type="submit" value="Search" id="searchBtn">
            <button type="button" id="luckyBtn">I'm Feeling Lucky</button>
        </div>
    </form>
    <div class="welcome-text">Everything on the internet is forever</div>
    <div class="footer">
        <a href="#">Advertising Programs</a> - <a href="https://www.youtube.com/@LarryFoxChannel" target="_blank">About Netcore</a>
        <div class="copyright">©2006 Netcore - Searching 6,666,666,666 web pages</div>
    </div>
</div>
<script>
    const form = document.getElementById('searchForm');
    const input = document.getElementById('queryInput');
    const luckyBtn = document.getElementById('luckyBtn');
    
    function executeSearch(isLucky = false) {
        const query = input.value.trim();
        if (!query) {
            input.focus();
            return;
        }
        let targetUrl;
        if (isLucky) {
            // Поиск видеороликов на YouTube
            targetUrl = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(query) + '&sp=EgIQAQ%253D%253D';
        } else {
            targetUrl = 'https://www.google.com/search?q=' + encodeURIComponent(query);
        }
        window.top.location.href = targetUrl;
    }
    
    form.addEventListener('submit', function (e) {
        e.preventDefault();
        executeSearch(false);
    });
    
    luckyBtn.addEventListener('click', function () {
        executeSearch(true);
    });
    
    input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            executeSearch(false);
        }
    });
</script>
</body>
</html>
