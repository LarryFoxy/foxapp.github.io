<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Netcore</title>
    <style>
        body {
            background-color: #050a05;
            /* В качестве фона используется атмосферная текстура старых мониторов */
            background-image: linear-gradient(rgba(0, 20, 0, 0.85), rgba(0, 20, 0, 0.85)), 
                              url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            color: #bbccaa;
            font-family: Arial, sans-serif;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Эффект мерцания ЭЛТ-экрана */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 600px;
        }

        /* Стилизация разноцветного логотипа */
        .logo {
            font-family: 'Times New Roman', Times, serif;
            font-size: 70px;
            font-weight: normal;
            margin-bottom: 10px;
            letter-spacing: -2px;
        }
        .logo span:nth-child(1) { color: #4285F4; } /* N */
        .logo span:nth-child(2) { color: #EA4335; } /* e */
        .logo span:nth-child(3) { color: #FBBC05; } /* t */
        .logo span:nth-child(4) { color: #4285F4; } /* c */
        .logo span:nth-child(5) { color: #34A853; } /* o */
        .logo span:nth-child(6) { color: #EA4335; } /* r */
        .logo span:nth-child(7) { color: #FBBC05; } /* e */

        .links-top {
            margin-bottom: 5px;
        }
        .links-top a {
            color: #ddeeaa;
            text-decoration: underline;
            margin: 0 4px;
            font-size: 12px;
        }
        .links-top a.active {
            font-weight: bold;
            color: #fff;
            text-decoration: none;
        }

        form {
            margin-bottom: 15px;
        }

        .search-wrapper {
            display: inline-block;
            position: relative;
        }

        /* Строка поиска в стиле 2000-х */
        input[type="text"] {
            width: 380px;
            padding: 3px;
            border: 1px solid #556644;
            background-color: #0b140b;
            color: #ddeedd;
            font-size: 14px;
            outline: none;
        }

        .side-links {
            position: absolute;
            left: 395px;
            top: -5px;
            text-align: left;
            white-space: nowrap;
            font-size: 11px;
        }
        .side-links a {
            color: #aabf99;
            text-decoration: underline;
            display: block;
            line-height: 1.2;
        }

        .buttons {
            margin-top: 10px;
        }
        /* Олдскульные кнопки */
        input[type="submit"], button {
            background-color: #152215;
            color: #bbccaa;
            border: 1px solid #445533;
            padding: 2px 8px;
            margin: 0 3px;
            cursor: pointer;
            font-size: 13px;
        }
        input[type="submit"]:hover, button:hover {
            background-color: #203320;
            color: #ddeedd;
        }

        .welcome-text {
            color: #889977;
            font-size: 13px;
            margin-top: 15px;
            text-decoration: underline;
            cursor: pointer;
        }

        .footer {
            margin-top: 40px;
            font-size: 11px;
        }
        .footer a {
            color: #aabf99;
            text-decoration: underline;
            margin: 0 5px;
        }
        .copyright {
            color: #667755;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Логотип Netcore -->
    <div class="logo">
        <span>N</span><span>e</span><span>t</span><span>c</span><span>o</span><span>r</span><span>e</span>
    </div>

    <!-- Верхние вкладки -->
    <div class="links-top">
        <a class="active" href="#">Web</a>
        <a href="#">Images</a>
        <a href="#">Groups</a>
        <a href="#">News</a>
        <a href="#">Froogle</a>
        <a href="#">more »</a>
    </div>

    <!-- Форма поиска (ведет в реальный Google) -->
    <form action="https://google.com" method="GET">
        <div class="search-wrapper">
            <input type="text" name="q" autofocus autocomplete="off">
            <div class="side-links">
                <a href="#">Advanced Search</a>
                <a href="#">Preferences</a>
                <a href="#">Language Tools</a>
            </div>
        </div>
        <div class="buttons">
            <input type="submit" value="Search">
            <button type="button" onclick="location.href='https://google.com?q=Special+retro+dossier&btnI=I'">I'm Feeling Lucky</button>
        </div>
    </form>

    <div class="welcome-text">Добро пожаловать в канал</div>

    <!-- Подвал страницы -->
    <div class="footer">
        <a href="#">Advertising Programs</a> - <a href="#">About Netcore</a>
        <div class="copyright">©2026 Netcore - Searching 8,058,044,651 web pages</div>
    </div>
</div>

</body>
</html>
